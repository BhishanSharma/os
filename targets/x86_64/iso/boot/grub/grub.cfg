set timeout=2
set default=0

# Video drivers for the framebuffer the kernel asks for in its multiboot2
# header (UEFI has no VGA text mode; BIOS gets a framebuffer too).
insmod all_video
# UEFI: keep the screen mode the firmware set up (the panel's own resolution).
# Without this GRUB picks the mode itself, and when it cannot read the
# panel's EDID (as on some laptops) it falls back to 800x600, stretched.
if [ "${grub_platform}" = "efi" ]; then
    set gfxpayload=keep
fi
# The RAM disk image is gzipped; gzio lets module2 unpack it while loading.
insmod gzio

menuentry "Terminal OS" {
    multiboot2 /boot/kernel.bin
    module2 /boot/ramdisk.img.gz ramdisk
    boot
}

# If the other cores cause trouble on some machine: the boot core only.
menuentry "Terminal OS (one CPU core)" {
    multiboot2 /boot/kernel.bin nosmp
    module2 /boot/ramdisk.img.gz ramdisk
    boot
}
